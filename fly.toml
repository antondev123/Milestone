# Fly.io config. Deploy with `npm run deploy:fly` (reads .env.local for secrets and build args).
# One machine, never stopped, progress JSON on a volume: the store in src/lib/store.ts stays file-backed.
app = "commute-course"
primary_region = "jnb"

[build]

[env]
  PORT = "3000"
  # read-aloud cache on the volume so a block is billed once per deploy, not once per machine restart
  TTS_CACHE_DIR = "/app/data/progress/tts"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "progress"
  destination = "/app/data/progress"
